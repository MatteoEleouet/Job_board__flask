<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
    <link href="styleset.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Test modal</title>
  <body>
    <h1>Hello, world!</h1>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSignUp">
        Connectez-vous
    </button>


    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSetting">
        Modifiez vos informations
    </button>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalApplication">
        Postuler
    </button>



    <!-- Modal -->
<div class="modal fade" id="modalSetting" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <button type="button" class="btn-close p-3 ml-5 -end" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="modal-body">
          <div class="wrapper bg-white">
            <h4 class="pb-4 border-bottom">Account settings</h4>
            <div class="pb-4">
                <div class="row">
                    <div class="col-md-6">
                        <label for="firstname">Prénom</label>
                        <input type="text" class="bg-light form-control" placeholder="METTRE LE PRENOM">
                    </div>
                    <div class="col-md-6 pt-md-0 pt-3">
                        <label for="lastname">Nom de famille</label>
                        <input type="text" class="bg-light form-control" placeholder="METTRE LE NOM">
                    </div>
                </div>
                <div class="row py-2">
                    <div class="col-md-6">
                        <label for="email">Adresse email</label>
                        <input type="text" class="bg-light form-control" placeholder="METTRE LE NOM">
                    </div>
                    <div class="col-md-6 pt-md-0 pt-3">
                        <label for="phone">Numéro de tel</label>
                        <input type="tel" class="bg-light form-control" placeholder="METTRE LE NUMERO DE TEL">
                    </div>
                </div>
                <div class="row py-2">
                    <div class="col-md-6"> <label for="password1">Mot de passe</label>
                        <input type="password" class="bg-light form-control" placeholder="********">
                    </div>
                    <div class="col-md-6 pt-md-0 pt-3"> <label for="password2">Confirmez votre mot de passe</label>
                        <input type="password" class="bg-light form-control" placeholder="********">
                    </div>
                </div>
            </div>
                <div class="py-3 pb-4"> <button class="btn btn-primary mr-3">Enregistrer les modifications</button> <button class="btn border button">Annuler</button> </div>
                <!-- <div class="d-sm-flex align-items-center pt-3" id="desactivate">
                    <div> <b>Desactivate your account</b>
                        <p>Details about your company account and password</p>
                    </div>
                    <div class="ml-auto"> <button class="btn btn-danger">Desactivate</button> </div>
                </div> -->
            </div>
        </div>
        </div>
      </div>
    </div>
  </div>




  <!-- Modal -->
  <div class="modal fade" id="modalRegister" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-body">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <section class="Form my-4 mx-5 sectionForm">
                <div class="container">
                    <div class="row g-0">
                        <div class="col-lg-5 text-center mt-4">
                            <img src="img/logo1.png" class="img-fluid logo1">
                            <!-- <div class="d-flex justify-content-center">...</div> -->
                            <img src="img/logo2.png" class="img-fluid logo2">
                            <img src="img/logo3.png" class="img-fluid logo3">
                        </div>
                        <div class="col-lg-7 px-5">
                            <!-- <h1 class="font-weight-bold py-3">AlloJob</h1> -->
                            <!-- <img src="img/logo2.png" class="img-fluid w-50 mb-4"> -->
                            <h4 class="pb-2 pt-5 connectezVous">Inscrivez-vous</h4>
                            <form>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="text" class="form-control my-3 p-2" id="first_name" name="first_name" placeholder="Votre prénom">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="text" id="name" name="name" class="form-control my-3 p-2" placeholder="Votre nom">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="email" id="email" name="email" class="form-control my-3 p-2" placeholder="Votre adresse email">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="password1" id="password1" name="password1" class="form-control my-3" placeholder="********">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="password2" id="password1" name="password2" class="form-control my-3" placeholder="********">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-12 col-md-12">
                                        <input type="tel" class="form-control my-3 p-2" id="phone" name="phone" placeholder="Votre numéro de téléphone">
                                    </div>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                                    <label class="form-check-label" for="flexRadioDefault1">
                                      Je suis un chercher d'emploi
                                    </label>
                                  </div>
                                  <div class="form-check">
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                                    <label class="form-check-label" for="flexRadioDefault2">
                                      Je suis un recruteur
                                    </label>
                                  </div>
    
                                <div class="form-row">
                                    <div class="col-lg-8 col-md-12">
                                        <button type="button" class="btn1 mt-2 mb-3">Inscription</button>
                                    </div>
                                </div>
                                <p class="pb-5">Déjà inscrit ? <a href="#" data-bs-toggle="modal" data-bs-target="#modalSignUp" data-bs-dismiss="modal" aria-label="Close">Connectez-vous</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
      </div>
    </div>
  </div>



  <div class="modal fade" id="modalSignUp" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-body">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <section class="Form my-4 mx-5 sectionForm">
                <div class="container">
                    <div class="row g-0">
                        <div class="col-lg-5 text-center mt-4">
                            <img src="img/logo1.png" class="img-fluid logo1">
                            <!-- <div class="d-flex justify-content-center">...</div> -->
                            <img src="img/logo2.png" class="img-fluid logo2">
                            <img src="img/logo3.png" class="img-fluid logo3">
                        </div>
                        <div class="col-lg-7 px-5">
                            <!-- <h1 class="font-weight-bold py-3">AlloJob</h1> -->
                            <!-- <img src="img/logo2.png" class="img-fluid w-50 mb-4"> -->
                            <h4 class="pb-2 pt-5 connectezVous">Connectez-vous</h4>
                            <form>
                                <div class="form-row">
                                    <div class="col-lg-7">
                                        <input type="email" id="email" name="email" class="form-control my-3 p-2" placeholder="Votre adresse email">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-7">
                                        <input type="password" id="password" name="password" class="form-control my-3" placeholder="********">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="col-lg-7">
                                        <button type="button" class="btn1 mt-2 mb-3">Connexion</button>
                                    </div>
                                </div>
                                <p class="pb-5">Pas encore inscrit ? <a href="#" data-bs-toggle="modal" data-bs-target="#modalRegister" data-bs-dismiss="modal" aria-label="Close">Inscrivez-vous</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
      </div>
    </div>
  </div>




<!-- ============================ APPLICATION EN BAS ======================================== -->
<div class="modal fade" id="modalApplication" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title ms-5" id="exampleModalLabel">Postuler pour un emploi</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body container-fluid">
            <form>                
                <div class="form-group row ms-5 me-5 mt-4">
                    <label for="name" class="col-sm-2 col-form-label"><h5>Nom complet</h5></label>
                    <div class="col-sm-5">
                        <input type="text" class="form-control" id="prenom" placeholder="Prénom">
                    </div>
                    <div class="col-sm-5">
                        <input type="text" class="form-control" id="nom" placeholder="Nom">
                    </div>
                </div>
                <br><hr><br>
                <div class="form-group row ms-5 me-5">
                    <label for="email" class="col-sm-2 col-form-label"><h5>Email</h5></label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="mailuser" placeholder="email@example.com">
                    </div>
                </div>
                <br><hr><br>
                <div class="form-group row ms-5 me-5">
                    <label for="message_chomeur" class="col-sm-2 col-form-label"><h5>Message</h5></label>
                    <div class="col-sm-10">
                        <textarea class="form-control messageChomeur" id="message_demandeur" placeholder="Message envoyé à l'employeur"></textarea>
                    </div>
                </div>
                <br><hr><br>
                <hr><br>
                <button type="button" class="btn btn-primary btn-lg ms-5 me-5" id="postuler">Envoyer la candidature</button>
            </form>
        </div>
      </div>
    </div>
  </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </body>
</html>
